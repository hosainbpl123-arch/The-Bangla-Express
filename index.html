<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bangla Express – সর্বশেষ সংবাদ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&family=Noto+Serif+Bengali:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#12202e;--muted:#5b6b7b;--line:#d9e0e6;--brand:#0a5c7a;--alert:#c4182f;--alert-ink:#fff;
--c-bd:#0a5c7a;--c-world:#6a4c93;--c-eco:#2b7a4b;--c-sport:#d9730d;--c-tech:#1f5fbf;--c-ent:#b5338a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--surface:#16212d;--ink:#e8eef3;--muted:#9aabba;--line:#2a3948;--brand:#4cb5d9;--alert:#e5384f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--surface:#16212d;--ink:#e8eef3;--muted:#9aabba;--line:#2a3948;--brand:#4cb5d9;--alert:#e5384f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Noto Serif Bengali",Georgia,serif;line-height:1.35;margin:0}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;padding-bottom:6px;font-size:.85rem;color:var(--muted)}
.brand{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-decoration:none;color:var(--ink)}
#globe{width:112px;height:112px;flex:none}
.bw{display:flex;flex-direction:column;align-items:flex-start;line-height:1;text-align:left}
.bw .the{font:700 .8rem Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bw .nm{font:900 clamp(1.9rem,7vw,3.1rem) Arial,Helvetica,sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink)}
.bw .nm span{color:var(--alert)}
.bw .tg{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:.9rem}
.bw .lv{background:var(--alert);color:var(--alert-ink);padding:1px 8px;border-radius:4px;font:700 .72rem Arial,sans-serif;letter-spacing:.15em;animation:lvb 1.2s steps(2,start) infinite}
@keyframes lvb{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bw .lv{animation:none}}
.mast{text-align:center;padding:18px 0 12px}
.mast h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;color:var(--brand);letter-spacing:-.01em}
.mast p{margin:0;color:var(--muted);font-size:.95rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink);font:500 1rem "Noto Sans Bengali",sans-serif;padding:10px 14px;cursor:pointer}
nav button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:700}
nav button:focus-visible,.theme:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.ticker{background:var(--alert);color:var(--alert-ink);display:flex;align-items:stretch;overflow:hidden}
.ticker b{flex:none;padding:6px 14px;background:rgba(0,0,0,.25);font-weight:700}
.ticker div{white-space:nowrap;padding:6px 0;animation:slide 40s linear infinite}
.ticker:hover div{animation-play-state:paused}
@keyframes slide{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none;white-space:normal;padding:6px 12px}}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin:24px 0}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lead .art{height:240px;background:linear-gradient(135deg,var(--cat),#12202e);display:flex;align-items:flex-end;padding:16px}
.tag{display:inline-block;background:var(--cat);color:#fff;font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:3px}
.lead .body{padding:18px 20px 22px}
.lead h2{font-size:clamp(1.6rem,4.2vw,2.3rem);font-weight:800;margin:6px 0 10px}
.lead p{margin:0 0 10px;font-size:1.05rem}
.meta{font-size:.82rem;color:var(--muted)}
aside{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 18px 12px;align-self:start}
aside h3{font-size:1.15rem;padding:12px 0 8px;border-bottom:2px solid var(--brand)}
.item{display:block;padding:12px 0;border-bottom:1px solid var(--line);border-left:4px solid var(--cat);padding-left:12px;margin-top:10px}
.item:last-child{border-bottom:0}
.item h3{font-size:1rem;font-weight:600;line-height:1.5}
.sec{margin:8px 0 14px;font-size:1.3rem;border-left:5px solid var(--brand);padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cat);border-radius:4px;padding:14px 16px 16px}
.card h3{font-size:1.1rem;font-weight:700;margin:8px 0 6px}
.card p{margin:0 0 8px;color:var(--muted);font-size:.95rem}
.empty{padding:40px;text-align:center;color:var(--muted)}
.sub{background:var(--brand);color:#fff;padding:26px 0;margin-top:20px}
.sub .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.sub h2{font-size:1.4rem}
.sub form{display:flex;gap:8px;flex:1 1 300px;max-width:440px}
.sub input{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:4px;font:inherit}
.sub button{padding:10px 18px;border:0;border-radius:4px;background:#12202e;color:#fff;font:700 1rem "Noto Sans Bengali",sans-serif;cursor:pointer}
footer{padding:18px 0;color:var(--muted);font-size:.85rem;text-align:center}
.theme{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:2px 10px;cursor:pointer;font:inherit}
.ep-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:20px 0 12px}
.ep-bar>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ep-bar button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font:inherit;cursor:pointer}
.ep-bar button:disabled{opacity:.4;cursor:default}
.ep-main{display:grid;grid-template-columns:130px 1fr;gap:16px;margin-bottom:32px}
@media (max-width:700px){.ep-main{grid-template-columns:1fr}.thumbs{flex-direction:row!important;overflow-x:auto}}
.thumbs{display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.th{flex:none;min-width:96px;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:6px;color:var(--ink);font:.8rem "Noto Sans Bengali",sans-serif;cursor:pointer;text-align:center}
.th[aria-pressed="true"]{border-color:var(--brand)}
.mini{display:block;height:70px;margin-bottom:4px;background:repeating-linear-gradient(#cfd6dc 0 2px,#fff 2px 6px);border:1px solid var(--line)}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;overflow:auto;max-height:85vh}
.pg{margin:0 auto;min-width:300px;background:#fff;color:#111;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-bottom:3px double #111;padding-bottom:6px;font-size:.85rem}
.pg-h b{font:800 1.6rem "Noto Serif Bengali",serif;color:#0a5c7a}
.pg-t{font-weight:700;margin:8px 0 12px;padding-bottom:4px;border-bottom:1px solid #999}
.pg-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pg-b{border-top:2px solid #111;padding-top:6px}
.pg-b.big{grid-column:span 2}
.pg-b h4{margin:0 0 6px;font:700 1rem/1.4 "Noto Serif Bengali",serif}
.pg-b.big h4{font-size:1.5rem}
.ln{height:90px;background:repeating-linear-gradient(#bbb 0 2px,#fff 2px 7px)}
</style>
</head>
<body>
<div class="top"><div class="wrap"><span id="date"></span><button class="theme" id="theme" type="button" aria-label="থিম বদলান">🌓 থিম</button></div></div>
<header class="mast wrap"><a class="brand" href="#" aria-label="The Bangla Express"><canvas id="globe" aria-hidden="true"></canvas><div class="bw"><span class="the">The</span><span class="nm">Bangla <span>Express</span></span><span class="tg"><span class="lv">LIVE</span><span>সত্য, দ্রুত ও নির্ভরযোগ্য সংবাদ</span></span></div></a></header>
<nav aria-label="বিভাগ"><div class="wrap" id="tabs"></div></nav>
<div class="ticker" aria-label="শিরোনাম"><b>সর্বশেষ</b><div id="ticker"></div></div>

<main class="wrap" id="news">
  <div class="grid" id="top"></div>
  <h2 class="sec" id="secTitle">আরও খবর</h2>
  <div class="cards" id="cards"></div>
</main>

<section class="wrap" id="epaper" hidden>
  <div class="ep-bar">
    <div><button type="button" id="dPrev">আগের দিন</button><b id="epDate"></b><button type="button" id="dNext">পরের দিন</button></div>
    <div><button type="button" id="pPrev" aria-label="আগের পাতা">‹</button><span id="epPg"></span><button type="button" id="pNext" aria-label="পরের পাতা">›</button><button type="button" id="zOut" aria-label="ছোট করুন">−</button><button type="button" id="zIn" aria-label="বড় করুন">+</button></div>
  </div>
  <div class="ep-main"><div class="thumbs" id="thumbs"></div><div class="viewer"><div class="pg" id="pgView"></div></div></div>
</section>

<section class="sub"><div class="wrap">
  <h2>প্রতিদিনের খবর ইমেইলে পান</h2>
  <form id="f"><input type="email" required placeholder="আপনার ইমেইল" aria-label="ইমেইল"><button type="submit">সাবস্ক্রাইব</button></form>
</div></section>
<footer class="wrap">© ২০২৬ The Bangla Express। এখানকার সংবাদ নমুনা বিষয়বস্তু; আসল সংবাদ দিয়ে বদলে নিন।</footer>

<script>
var CATS={all:["সব খবর","--brand"],bd:["বাংলাদেশ","--c-bd"],world:["আন্তর্জাতিক","--c-world"],eco:["অর্থনীতি","--c-eco"],sport:["খেলা","--c-sport"],tech:["প্রযুক্তি","--c-tech"],ent:["বিনোদন","--c-ent"],epaper:["ই-পেপার","--brand"]};
var NEWS=[
{c:"bd",t:"নতুন মৌসুমে ধানের বাম্পার ফলনের আশা, কৃষকদের মুখে হাসি",s:"মাঠপর্যায়ের প্রতিবেদনে দেখা যাচ্ছে, অনুকূল আবহাওয়ায় এবার ফলন গত বছরের চেয়ে ভালো হতে পারে। কৃষি কর্মকর্তারা সময়মতো সার সরবরাহের ওপর জোর দিচ্ছেন।",m:"২ ঘণ্টা আগে"},
{c:"eco",t:"বাজারে নিত্যপণ্যের দামে স্থিতিশীলতা, সবজির দাম কিছুটা কমেছে",s:"রাজধানীর খুচরা বাজারে সপ্তাহজুড়ে বেশির ভাগ পণ্যের দাম প্রায় অপরিবর্তিত ছিল।",m:"৩ ঘণ্টা আগে"},
{c:"tech",t:"গ্রামাঞ্চলে ইন্টারনেট সংযোগ সম্প্রসারণে নতুন উদ্যোগ",s:"তরুণ উদ্যোক্তারা কমিউনিটি নেটওয়ার্কের মাধ্যমে দুর্গম এলাকায় সাশ্রয়ী সংযোগ পৌঁছে দিচ্ছেন।",m:"৪ ঘণ্টা আগে"},
{c:"sport",t:"ঘরোয়া ক্রিকেটে নজর কাড়ছে একঝাঁক নতুন মুখ",s:"চলতি লিগে তরুণ ব্যাটার ও স্পিনারদের পারফরম্যান্সে খুশি নির্বাচকেরা।",m:"৫ ঘণ্টা আগে"},
{c:"world",t:"জলবায়ু সম্মেলনের আগে উপকূলীয় দেশগুলোর যৌথ অবস্থানের আহ্বান",s:"ঝুঁকিতে থাকা দেশগুলো অভিযোজন তহবিল বাড়ানোর দাবিতে একসঙ্গে কাজ করার কথা বলছে।",m:"৬ ঘণ্টা আগে"},
{c:"ent",t:"আন্তর্জাতিক চলচ্চিত্র উৎসবে দেশের স্বল্পদৈর্ঘ্য ছবির প্রদর্শনী",s:"তিনটি স্বাধীন নির্মাণ এবার উৎসবের বিশেষ বিভাগে জায়গা পেয়েছে।",m:"আজ সকালে"},
{c:"bd",t:"শীতের আগে ঢাকায় বায়ুমান নিয়ে সচেতনতার আহ্বান",s:"বিশেষজ্ঞরা নির্মাণকাজে ধুলা নিয়ন্ত্রণ ও যানবাহনের নিয়মিত পরীক্ষার ওপর গুরুত্ব দিয়েছেন।",m:"আজ সকালে"},
{c:"eco",t:"ক্ষুদ্র ও মাঝারি উদ্যোগে ডিজিটাল পেমেন্টের ব্যবহার বাড়ছে",s:"মোবাইল আর্থিক সেবার মাধ্যমে লেনদেন বাড়ায় ছোট ব্যবসায়ীদের নগদ ঝুঁকি কমেছে।",m:"গতকাল"},
{c:"tech",t:"কৃত্রিম বুদ্ধিমত্তা শেখাতে স্কুলে নতুন কর্মশালা",s:"শিক্ষার্থীরা হাতেকলমে প্রযুক্তি শিখছে, শিক্ষকদের জন্যও আলাদা প্রশিক্ষণ চলছে।",m:"গতকাল"},
{c:"sport",t:"মেয়েদের ফুটবলে গ্রামীণ প্রতিভা খুঁজে বের করার প্রকল্প",s:"জেলা পর্যায়ে বাছাই শেষে সেরা খেলোয়াড়েরা জাতীয় ক্যাম্পে ডাক পাবেন।",m:"গতকাল"}
];
var cur="all",$=function(i){return document.getElementById(i)};
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function cv(c){return "style=\"--cat:var("+CATS[c][1]+")\""}
function render(){
  var ep=cur==="epaper";$("epaper").hidden=!ep;$("news").hidden=ep;
  if(ep){drawPaper();return}
  var list=NEWS.filter(function(n){return cur==="all"||n.c===cur});
  var top=$("top"),cards=$("cards");top.innerHTML="";cards.innerHTML="";
  $("secTitle").textContent=cur==="all"?"আরও খবর":CATS[cur][0];
  if(!list.length){cards.innerHTML="<p class='empty'>এই বিভাগে এখনো কোনো খবর নেই।</p>";return}
  var L=list[0],side=list.slice(1,5),rest=list.slice(5);
  top.appendChild(el("<article class='lead' "+cv(L.c)+"><div class='art'><span class='tag'>"+CATS[L.c][0]+"</span></div><div class='body'><h2>"+L.t+"</h2><p>"+L.s+"</p><span class='meta'>"+L.m+"</span></div></article>"));
  if(side.length){var a=el("<aside><h3>আরও পড়ুন</h3></aside>");side.forEach(function(n){a.appendChild(el("<div class='item' "+cv(n.c)+"><h3>"+n.t+"</h3><span class='meta'>"+CATS[n.c][0]+" · "+n.m+"</span></div>"))});top.appendChild(a)}
  else top.style.gridTemplateColumns="1fr";
  if(side.length)top.style.gridTemplateColumns="";
  rest.forEach(function(n){cards.appendChild(el("<article class='card' "+cv(n.c)+"><span class='tag'>"+CATS[n.c][0]+"</span><h3>"+n.t+"</h3><p>"+n.s+"</p><span class='meta'>"+n.m+"</span></article>"))});
  if(!rest.length)$("secTitle").style.display="none";else $("secTitle").style.display="";
}
Object.keys(CATS).forEach(function(k){
  var b=document.createElement("button");b.type="button";b.textContent=CATS[k][0];b.setAttribute("aria-pressed",k===cur);
  b.onclick=function(){cur=k;[].forEach.call($("tabs").children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
  $("tabs").appendChild(b);
});
$("ticker").textContent=NEWS.slice(0,5).map(function(n){return n.t}).join("   •   ");
$("date").textContent=new Date().toLocaleDateString("bn-BD",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
$("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"};
$("f").onsubmit=function(e){e.preventDefault();e.target.innerHTML="<b>ধন্যবাদ! সাবস্ক্রিপশন নেওয়া হয়েছে।</b>"};
var EP={d:new Date(),p:1,z:1,N:8},PN=["প্রথম পাতা","বাংলাদেশ","বাংলাদেশ","অর্থনীতি","আন্তর্জাতিক","সম্পাদকীয়","খেলা","বিনোদন"];
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function pageHTML(p){
  var d=EP.d.toLocaleDateString("bn-BD",{year:"numeric",month:"long",day:"numeric"});
  var h="<div class='pg-h'><b>The Bangla Express</b><span>"+d+" · পাতা "+bn(p)+"</span></div><div class='pg-t'>"+PN[p-1]+"</div><div class='pg-g'>";
  for(var i=0;i<4;i++){var n=NEWS[(p+i)%NEWS.length];h+="<div class='pg-b"+(i===0?" big":"")+"'><h4>"+n.t+"</h4><div class='ln'></div></div>"}
  return h+"</div>";
}
function drawPaper(){
  var today=EP.d.toDateString()===new Date().toDateString();

var tc=document.createElement('canvas'),tx=tc.getContext('2d');
function tint(img,col){tc.width=img.width;tc.height=img.height;tx.globalCompositeOperation='source-over';tx.clearRect(0,0,tc.width,tc.height);tx.drawImage(img,0,0);tx.globalCompositeOperation='source-in';tx.fillStyle=col;tx.fillRect(0,0,tc.width,tc.height);return tc;}
var st='spin',tm=0,last=performance.now(),lam=-35,phi=18,k=0,l1=0,lt=0,clock=0;
function ease(x){return x*x*(3-2*x);}
function frame(now){
  var dt=Math.min(now-last,50),u,e;last=now;tm+=dt;clock+=dt;
  if(st==='spin'){lam+=dt*0.012;phi=15;k=0;if(tm>6500){st='in';tm=0;l1=lam%360;lt=l1+(((90.4-l1)+540)%360-180);}}
  else if(st==='in'){u=Math.min(tm/2200,1);e=ease(u);lam=l1+(lt-l1)*e;phi=15+8.7*e;k=e;if(u>=1){st='hold';tm=0;}}
  else if(st==='hold'){lam=lt;phi=23.7;k=1;if(tm>3200){st='out';tm=0;}}
  else{u=Math.min(tm/2200,1);e=ease(u);lam=lt;phi=23.7-8.7*e;k=1-e;if(u>=1){st='spin';tm=0;lam=lt;}}

}
